<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaxon Muños · Stack explorer</title>
<meta name="description" content="Interactive map of the technologies Jaxon Muños builds with, and where each one was used in production.">
<style>
:root{
  --bg1:#15171b;--bg2:#0f1013;--card:#1b1e23;--card2:#20242a;--line:#2a2e35;
  --hi:#f3f4f6;--txt:#d1d5db;--dim:#8b93a0;--faint:#5b6370;--blue:#2f6bff;--cyan:#7fd6ff;--chip:#262a31;
  --sans:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){:root{
  --bg1:#fbfbfc;--bg2:#eef1f5;--card:#ffffff;--card2:#f7f8fa;--line:#e2e5ea;
  --hi:#111418;--txt:#2b3038;--dim:#5f6774;--faint:#9aa2ad;--blue:#2459e0;--cyan:#0b8fd6;--chip:#eef1f5;
}}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--txt);background:radial-gradient(1200px 700px at 50% 45%,color-mix(in srgb,var(--blue) 14%,transparent),transparent),linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh}
a{color:var(--cyan)}
.wrap{max-width:1280px;margin:0 auto;padding:32px 24px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.22em;color:var(--cyan)}
h1{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.02em;color:var(--hi);margin-top:6px}
.sub{color:var(--dim);margin-top:6px;font-size:15px}
.back{font-family:var(--mono);font-size:13px;text-decoration:none;border:1px solid var(--line);padding:9px 14px;border-radius:999px;background:var(--card)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filter{font-family:var(--mono);font-size:12px;letter-spacing:.06em;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:8px 12px;border-radius:999px;cursor:pointer;transition:.2s}
.filter:hover{border-color:var(--cyan)}
.filter.on{background:linear-gradient(90deg,#2f6bff,#7fd6ff);color:#fff;border-color:transparent}
.search{margin-left:auto;font-family:var(--mono);font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--hi);padding:9px 14px;border-radius:999px;min-width:220px;outline:none}
.search:focus{border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:1fr 360px;gap:18px}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.stage{position:relative;background:color-mix(in srgb,var(--card) 55%,transparent);border:1px solid var(--line);border-radius:18px;overflow:hidden;aspect-ratio:1.571}
svg{width:100%;height:100%;display:block}
.orbit{fill:none;stroke:var(--faint);stroke-opacity:.35;stroke-dasharray:2 10}
.orbit.lit{stroke:var(--cyan);stroke-opacity:.9}
.node{cursor:pointer;transition:opacity .25s}
.node rect{fill:var(--card);stroke:var(--line);transition:.2s}
.node text{font-family:var(--mono);font-size:12.5px;fill:var(--hi)}
.node:hover rect,.node.sel rect{stroke:var(--cyan);stroke-width:2}
.node.dim{opacity:.16}
.node.ai rect{stroke:var(--blue)}
.core{fill:var(--card);stroke:url(#rb);stroke-width:2.4}
.coreT{font-family:var(--sans);font-weight:800;font-size:24px;fill:var(--hi)}
.link{stroke:var(--cyan);stroke-opacity:.5;stroke-width:1.2;fill:none;stroke-dasharray:3 4}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.panel h2{font-size:24px;color:var(--hi);display:flex;gap:10px;align-items:center}
.panel h2 svg{width:24px;height:24px}
.layer{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--cyan)}
.hint{color:var(--dim);font-size:14px;line-height:1.6}
.ctx{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px 14px}
.ctx b{color:var(--hi);font-size:14.5px}
.ctx span{display:block;font-family:var(--mono);font-size:11.5px;color:var(--cyan);margin:3px 0 6px}
.ctx p{font-size:13.5px;line-height:1.55}
.count{font-family:var(--mono);font-size:12px;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--dim)}
footer{margin-top:28px;color:var(--faint);font-family:var(--mono);font-size:12px;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">STACK EXPLORER</div>
      <h1>The stack I build with, and where it ran</h1>
      <p class="sub">Hover or tap a technology to see the projects and teams where I used it in production.</p>
    </div>
    <a class="back" href="https://github.com/jaxonjma">← github.com/jaxonjma</a>
  </header>

  <div class="controls" id="filters">
    <button class="filter on" data-layer="all">ALL</button>
    <button class="filter" data-layer="0">LANGUAGES &amp; FRAMEWORKS</button>
    <button class="filter" data-layer="1">DATA &amp; MESSAGING</button>
    <button class="filter" data-layer="2">CLOUD &amp; DEVOPS</button>
    <button class="filter" data-layer="3">AI &amp; AGENTS</button>
    <input class="search" id="q" placeholder="search: kafka, rag…" aria-label="Search technologies">
  </div>

  <div class="grid">
    <div class="stage"><svg id="sky" viewBox="0 0 1100 700" role="img" aria-label="Constellation of technologies"></svg></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <div class="legend" id="legend"></div>
  <footer>Jaxon Muños · Software Engineer &amp; AI Engineer · Medellín, Colombia</footer>
</div>

el("circle",{cx:C.x,cy:C.y,r:40,class:"core"});const ct=el("text",{x:C.x,y:C.y+8,"text-anchor":"middle",class:"coreT"});ct.textContent="JM";

const nodes=[];const byLayer=[[],[],[],[]];T.forEach(t=>byLayer[t[1]].push(t));
byLayer.forEach((arr,li)=>arr.forEach((t,k)=>{
  const g=el("g",{class:"node"+(li===3?" ai":""),tabindex:0,role:"button","aria-label":t[0]});
  const w=42+t[0].length*7.4,h=30;const rect=el("rect",{width:w,height:h,rx:15,x:-w/2,y:-h/2},g);
  el("circle",{cx:-w/2+16,cy:0,r:10,fill:"var(--chip)"},g);
  const ic=iconSvg(t[0],13);if(ic){ic.setAttribute("x",-w/2+9.5);ic.setAttribute("y",-6.5);g.appendChild(ic)}else el("rect",{x:-w/2+12,y:-4,width:8,height:8,rx:2,fill:"url(#rb)",transform:`rotate(45 ${-w/2+16} 0)`},g);
  const tx=el("text",{x:-w/2+31,y:4.3},g);tx.textContent=t[0];
  const n={t,li,g,a0:(k/arr.length)*Math.PI*2+li*.7,speed:(li%2?-1:1)*(0.00006+0.00002*(3-li))};nodes.push(n);
  g.addEventListener("mouseenter",()=>show(n));g.addEventListener("focus",()=>show(n));g.addEventListener("click",()=>{pin=pin===n?null:n;show(n)});
}));
let pin=null,hover=null,paused=false,t0=performance.now(),layerF="all",q="";
sky.addEventListener("mouseenter",()=>paused=true);sky.addEventListener("mouseleave",()=>{paused=false;if(!pin)idle()});
function pos(n,time){const [rx,ry]=R[n.li];const a=n.a0+time*n.speed;return[C.x+rx*Math.cos(a),C.y+ry*Math.sin(a)]}
let frozen=0;
function frame(now){if(!paused&&!matchMedia("(prefers-reduced-motion: reduce)").matches)frozen+=16;for(const n of nodes){const[x,y]=pos(n,frozen);n.x=x;n.y=y;n.g.setAttribute("transform",`translate(${x.toFixed(1)} ${y.toFixed(1)})`)}drawLinks();requestAnimationFrame(frame)}
function drawLinks(){linkG.innerHTML="";const s=pin||hover;if(!s)return;for(const n of nodes){if(n===s)continue;if(n.t[2].some(c=>s.t[2].includes(c))&&visible(n)){const p=el("path",{d:`M${s.x} ${s.y} Q ${C.x} ${C.y} ${n.x} ${n.y}`,class:"link"},linkG)}}}
function visible(n){return(layerF==="all"||+layerF===n.li)&&(!q||n.t[0].toLowerCase().includes(q))}
function apply(){nodes.forEach(n=>n.g.classList.toggle("dim",!visible(n)));orbits.forEach((o,i)=>o.classList.toggle("lit",layerF!=="all"&&+layerF===i))}
function show(n){hover=n;nodes.forEach(m=>m.g.classList.toggle("sel",m===n));
  const ic=iconSvg(n.t[0],24);panel.innerHTML="";const h=document.createElement("h2");if(ic)h.appendChild(ic);h.appendChild(document.createTextNode(n.t[0]));
  const l=document.createElement("div");l.className="layer";l.textContent=LAYERS[n.li].toUpperCase();
  const c=document.createElement("div");c.className="count";c.textContent=`Used in ${n.t[2].length} ${n.t[2].length>1?"contexts":"context"} · dashed lines connect tech used together`;
  panel.append(l,h,c);n.t[2].forEach(k=>{const d=document.createElement("div");d.className="ctx";d.innerHTML=`<b>${CTX[k].t}</b><span>${CTX[k].r}</span><p>${CTX[k].d}</p>`;panel.appendChild(d)})}
function idle(){hover=null;nodes.forEach(m=>m.g.classList.remove("sel"));panel.innerHTML=`<div class="layer">HOW TO READ IT</div><h2>${T.length} technologies, 4 layers</h2><p class="hint">Each ring is a layer of the stack. Hover or tap any node to see where it ran in production; dashed links show what it was combined with. Use the filters or search to focus on one layer.</p><p class="hint">Inner rings: languages and data. Outer ring: the AI and agent work built on top of them.</p>`}
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest(".filter");if(!b)return;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("on",x===b));layerF=b.dataset.layer;apply()});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();apply();const m=nodes.filter(visible);if(q&&m.length===1)show(m[0])});
const lgd=document.getElementById("legend");LAYERS.forEach((L,i)=>{const s=document.createElement("span");s.textContent=`0${i+1} ${L.toUpperCase()}`;lgd.appendChild(s)});
idle();apply();requestAnimationFrame(frame);
</script>
</body>
</html>
