<rect x="250" y="740" width="75" height="26" rx="7" fill="#eef1f5"/>
<text class="mono" x="287" y="757.5" text-anchor="middle" font-size="12" fill="#374151">pgvector</text>
<rect x="332" y="740" width="103" height="26" rx="7" fill="#eef1f5"/>
