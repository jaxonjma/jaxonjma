<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-label="AI in production: freight dispatch agent, multi-tenant RAG with citations, state-machine sales agent, human-in-the-loop documents">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#f1f3f6"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0b8fd6"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity=".045"/></pattern>
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.cd{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.k0{animation-delay:0.00s}.k1{animation-delay:0.12s}.k2{animation-delay:0.24s}.k3{animation-delay:0.36s}.k4{animation-delay:0.48s}</style>
</defs>
<rect width="1200" height="810" rx="18" fill="url(#bg)"/><rect width="1200" height="810" rx="18" fill="url(#grid)"/>
<text class="mono" x="40" y="54" font-size="12.5" fill="#0b8fd6" letter-spacing=".22em">AI IN PRODUCTION</text>
<text class="sans" x="40" y="90" font-size="28" font-weight="800" fill="#111418" letter-spacing="-.5">Agents and RAG that run real operations</text>
<text class="sans" x="40" y="122" font-size="15.5" fill="#5f6774">The same discipline as distributed systems: state machines, tenant isolation, thresholds, and humans where it matters.</text>
<g class="cd k0"><rect x="40" y="160" width="551" height="257" rx="16" fill="#ffffff" stroke="#e2e5ea"/><text class="mono" x="66" y="190" font-size="11" fill="#0b8fd6" letter-spacing=".16em">AGENTIC DECISIONING</text><text class="sans" x="66" y="220" font-size="21" font-weight="800" fill="#111418" letter-spacing="-.3">Freight dispatch agent</text><rect x="66.0" y="242" width="104.0" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="118.0" y="261.5" text-anchor="middle" font-size="10.0" fill="#2b3038">Freight request</text><path d="M174.0 257.0 H190.8" stroke="#9aa2ad" stroke-width="1.2"/><path d="M185.8 253.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="194.8" y="242" width="92.0" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="240.8" y="261.5" text-anchor="middle" font-size="10.0" fill="#2b3038">Score drivers</text><path d="M290.8 257.0 H307.5" stroke="#9aa2ad" stroke-width="1.2"/><path d="M302.5 253.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="311.5" y="242" width="80.0" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="351.5" y="261.5" text-anchor="middle" font-size="10.0" fill="#2b3038">Agent picks</text><path d="M395.5 257.0 H412.2" stroke="#9aa2ad" stroke-width="1.2"/><path d="M407.2 253.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="416.2" y="242" width="62.0" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="447.2" y="261.5" text-anchor="middle" font-size="10.0" fill="#2b3038">WhatsApp</text><path d="M482.2 257.0 H499.0" stroke="#9aa2ad" stroke-width="1.2"/><path d="M494.0 253.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="503.0" y="242" width="62.0" height="30" rx="8" fill="#f7f8fa" stroke="url(#ribbon)" stroke-width="1.6"/><text class="mono" x="534.0" y="261.5" text-anchor="middle" font-size="10.0" fill="#111418">Assigned</text><path id="fp0" d="M74 281 H557" fill="none" stroke="#e2e5ea" stroke-width="1" stroke-dasharray="2 5"/><circle r="3.2" fill="#0b8fd6"><animateMotion dur="3.2s" begin="0.0s" repeatCount="indefinite"><mpath href="#fp0"/></animateMotion></circle><text class="sans" x="66" y="314" font-size="14" fill="#2b3038">Automates freight service assignment for a logistics operator.</text><text class="sans" x="66" y="335" font-size="14" fill="#2b3038">Drivers are ranked by performance score and contacted over WhatsApp,</text><text class="sans" x="66" y="356" font-size="14" fill="#2b3038">with GPS tracking and digital completion downstream.</text><text class="sans" x="66" y="387" font-size="14" font-weight="600" fill="#111418"><tspan fill="#0b8fd6">→ </tspan>Replaces manual dispatch and removes dispatcher bias.</text></g>
<g class="cd k1"><rect x="609" y="160" width="551" height="257" rx="16" fill="#ffffff" stroke="#e2e5ea"/><text class="mono" x="635" y="190" font-size="11" fill="#0b8fd6" letter-spacing=".16em">RETRIEVAL · GROUNDING</text><text class="sans" x="635" y="220" font-size="21" font-weight="800" fill="#111418" letter-spacing="-.3">Multi-tenant RAG with citations</text><rect x="635.0" y="242" width="45.5" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="657.8" y="261.5" text-anchor="middle" font-size="10.5" fill="#2b3038">Query</text><path d="M684.5 257.0 H700.3" stroke="#9aa2ad" stroke-width="1.2"/><path d="M695.3 253.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="704.3" y="242" width="121.1" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="764.8" y="261.5" text-anchor="middle" font-size="10.5" fill="#2b3038">Tenant by API key</text><path d="M829.4 257.0 H845.1" stroke="#9aa2ad" stroke-width="1.2"/><path d="M840.1 253.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="849.1" y="242" width="64.4" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="881.4" y="261.5" text-anchor="middle" font-size="10.5" fill="#2b3038">pgvector</text><path d="M917.5 257.0 H933.3" stroke="#9aa2ad" stroke-width="1.2"/><path d="M928.3 253.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="937.3" y="242" width="83.3" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="979.0" y="261.5" text-anchor="middle" font-size="10.5" fill="#2b3038">≥ threshold</text><path d="M1024.6 257.0 H1040.4" stroke="#9aa2ad" stroke-width="1.2"/><path d="M1035.4 253.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="1044.4" y="242" width="89.6" height="30" rx="8" fill="#f7f8fa" stroke="url(#ribbon)" stroke-width="1.6"/><text class="mono" x="1089.2" y="261.5" text-anchor="middle" font-size="10.5" fill="#111418">Cited answer</text><path id="fp1" d="M643 281 H1126" fill="none" stroke="#e2e5ea" stroke-width="1" stroke-dasharray="2 5"/><circle r="3.2" fill="#0b8fd6"><animateMotion dur="3.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#fp1"/></animateMotion></circle><text class="sans" x="635" y="314" font-size="14" fill="#2b3038">One engine, many tenants: isolation by API key, retrieval over</text><text class="sans" x="635" y="335" font-size="14" fill="#2b3038">pgvector, and answers only when the evidence clears a relevance</text><text class="sans" x="635" y="356" font-size="14" fill="#2b3038">threshold, always with citations.</text><text class="sans" x="635" y="387" font-size="14" font-weight="600" fill="#111418"><tspan fill="#0b8fd6">→ </tspan>Grounded answers instead of confident guesses.</text></g>
<g class="cd k2"><rect x="40" y="435" width="551" height="257" rx="16" fill="#ffffff" stroke="#e2e5ea"/><text class="mono" x="66" y="465" font-size="11" fill="#0b8fd6" letter-spacing=".16em">STATE MACHINES</text><text class="sans" x="66" y="495" font-size="21" font-weight="800" fill="#111418" letter-spacing="-.3">Multi-turn sales agent</text><rect x="66.0" y="517" width="91.9" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="112.0" y="536.5" text-anchor="middle" font-size="11.5" fill="#2b3038">Voice notes</text><path d="M161.9 532.0 H177.6" stroke="#9aa2ad" stroke-width="1.2"/><path d="M172.6 528.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="181.6" y="517" width="64.3" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="213.7" y="536.5" text-anchor="middle" font-size="11.5" fill="#2b3038">Whisper</text><path d="M249.9 532.0 H265.6" stroke="#9aa2ad" stroke-width="1.2"/><path d="M260.6 528.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="269.6" y="517" width="71.2" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="305.2" y="536.5" text-anchor="middle" font-size="11.5" fill="#2b3038">Playbook</text><path d="M344.8 532.0 H360.4" stroke="#9aa2ad" stroke-width="1.2"/><path d="M355.4 528.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="364.4" y="517" width="105.7" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="417.3" y="536.5" text-anchor="middle" font-size="11.5" fill="#2b3038">State machine</text><path d="M474.1 532.0 H489.8" stroke="#9aa2ad" stroke-width="1.2"/><path d="M484.8 528.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="493.8" y="517" width="71.2" height="30" rx="8" fill="#f7f8fa" stroke="url(#ribbon)" stroke-width="1.6"/><text class="mono" x="529.4" y="536.5" text-anchor="middle" font-size="11.5" fill="#111418">WhatsApp</text><path id="fp2" d="M74 556 H557" fill="none" stroke="#e2e5ea" stroke-width="1" stroke-dasharray="2 5"/><circle r="3.2" fill="#0b8fd6"><animateMotion dur="4.0s" begin="1.0s" repeatCount="indefinite"><mpath href="#fp2"/></animateMotion></circle><text class="sans" x="66" y="589" font-size="14" fill="#2b3038">A WhatsApp sales agent that replicates the human closer's flow. The</text><text class="sans" x="66" y="610" font-size="14" fill="#2b3038">playbook was mined from real voice notes transcribed with Whisper; a</text><text class="sans" x="66" y="631" font-size="14" fill="#2b3038">state machine keeps each conversation on track.</text><text class="sans" x="66" y="662" font-size="14" font-weight="600" fill="#111418"><tspan fill="#0b8fd6">→ </tspan>Predictable, auditable conversations, not free-form chat.</text></g>
<g class="cd k3"><rect x="609" y="435" width="551" height="257" rx="16" fill="#ffffff" stroke="#e2e5ea"/><text class="mono" x="635" y="465" font-size="11" fill="#0b8fd6" letter-spacing=".16em">HUMAN IN THE LOOP</text><text class="sans" x="635" y="495" font-size="21" font-weight="800" fill="#111418" letter-spacing="-.3">Compliance-safe documents</text><rect x="635.0" y="517" width="91.9" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="681.0" y="536.5" text-anchor="middle" font-size="11.5" fill="#2b3038">Sale closed</text><path d="M730.9 532.0 H759.8" stroke="#9aa2ad" stroke-width="1.2"/><path d="M754.8 528.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="763.8" y="517" width="147.1" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="837.3" y="536.5" text-anchor="middle" font-size="11.5" fill="#2b3038">AI pre-fills 6 docs</text><path d="M914.9 532.0 H943.8" stroke="#9aa2ad" stroke-width="1.2"/><path d="M938.8 528.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="947.8" y="517" width="91.9" height="30" rx="8" fill="#f7f8fa" stroke="#e2e5ea" stroke-width="1"/><text class="mono" x="993.8" y="536.5" text-anchor="middle" font-size="11.5" fill="#2b3038">Pro reviews</text><path d="M1043.7 532.0 H1072.6" stroke="#9aa2ad" stroke-width="1.2"/><path d="M1067.6 528.0 l5 4 -5 4" fill="none" stroke="#9aa2ad" stroke-width="1.2"/><rect x="1076.6" y="517" width="57.4" height="30" rx="8" fill="#f7f8fa" stroke="url(#ribbon)" stroke-width="1.6"/><text class="mono" x="1105.3" y="536.5" text-anchor="middle" font-size="11.5" fill="#111418">Signed</text><path id="fp3" d="M643 556 H1126" fill="none" stroke="#e2e5ea" stroke-width="1" stroke-dasharray="2 5"/><circle r="3.2" fill="#0b8fd6"><animateMotion dur="4.4s" begin="1.5s" repeatCount="indefinite"><mpath href="#fp3"/></animateMotion></circle><text class="sans" x="635" y="589" font-size="14" fill="#2b3038">At sale close the AI pre-fills six medical document templates; a</text><text class="sans" x="635" y="610" font-size="14" fill="#2b3038">licensed professional reviews and signs every one before it goes out.</text><text class="sans" x="635" y="662" font-size="14" font-weight="600" fill="#111418"><tspan fill="#0b8fd6">→ </tspan>Automation where it is safe, people where it is required.</text></g>
<text class="mono" x="40" y="728" font-size="11" fill="#9aa2ad" letter-spacing=".16em">IN PRODUCTION WITH</text>
