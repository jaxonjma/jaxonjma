<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Jaxon Muños — Software Engineer &amp; AI Engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15171b"/><stop offset="1" stop-color="#0f1013"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#7fd6ff"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}

.in{animation:in .9s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{animation:grow 1.3s cubic-bezier(.2,.7,.2,1) .35s backwards;transform-origin:left;transform-box:fill-box}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ph{animation:rot 12.8s ease-in-out infinite backwards}
@keyframes rot{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.nd{animation:nd 3s ease-in-out infinite}@keyframes nd{0%,100%{opacity:.45}50%{opacity:1}}
.ph0{animation-delay:0.0s}.ph1{animation-delay:3.2s}.ph2{animation-delay:6.4s}.ph3{animation-delay:9.600000000000001s}</style>
</defs>
<radialGradient id="glow" cx=".78" cy=".5" r=".5"><stop offset="0" stop-color="#2f6bff" stop-opacity=".18"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
<rect width="1200" height="440" rx="18" fill="url(#bg)"/><rect width="1200" height="440" rx="18" fill="url(#grid)"/>
<rect width="1200" height="440" rx="18" fill="url(#glow)"/>
<style>
.beam{animation:beam 2.4s cubic-bezier(.5,0,.5,1) infinite}
@keyframes beam{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-234px);opacity:0}}
.down{animation:down 2.8s cubic-bezier(.5,0,.5,1) infinite}
@keyframes down{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(234px);opacity:0}}
.hov{animation:hov 5s ease-in-out infinite}@keyframes hov{50%{transform:translateY(-5px)}}
</style>
