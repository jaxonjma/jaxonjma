<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-label="Work with me: backend that scales, AI agents and RAG, architecture and leadership, legacy modernization, payments, full product builds">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#f1f3f6"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0b8fd6"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity=".045"/></pattern>
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}

.in{animation:in .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wave{animation:wave 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 80%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.bub{animation:bub 9s ease-out infinite backwards}@keyframes bub{0%{opacity:0;transform:translateY(8px)}5%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
.prog{animation:prog 6s cubic-bezier(.6,0,.4,1) infinite;transform-origin:left;transform-box:fill-box}
@keyframes prog{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
.sd{animation:sd 6s linear infinite backwards}
.s0{animation:s0 6s linear infinite}@keyframes s0{0%,0.0%{fill:#ffffff}0.1%,100%{fill:#0b8fd6}}.s1{animation:s1 6s linear infinite}@keyframes s1{0%,23.2%{fill:#ffffff}23.4%,100%{fill:#0b8fd6}}.s2{animation:s2 6s linear infinite}@keyframes s2{0%,46.6%{fill:#ffffff}46.8%,100%{fill:#0b8fd6}}.s3{animation:s3 6s linear infinite}@keyframes s3{0%,69.9%{fill:#ffffff}70.1%,100%{fill:#0b8fd6}}</style>
</defs>
<rect width="1200" height="910" rx="18" fill="url(#bg)"/><rect width="1200" height="910" rx="18" fill="url(#grid)"/>
<text class="mono in" x="40" y="56" font-size="12.5" fill="#0b8fd6" letter-spacing=".22em">WORK WITH ME</text>
<g class="in" style="animation-delay:.1s"><text class="sans" x="40" y="102" font-size="40" font-weight="800" fill="#111418" letter-spacing="-1">Hey, reader <tspan class="wave">👋</tspan></text></g>
<g class="in" style="animation-delay:.2s"><text class="sans" x="40" y="140" font-size="18" fill="#2b3038">Building something that has to work in production? Let's talk.</text><text class="sans" x="40" y="166" font-size="15" fill="#5f6774">I join as an engineer, a tech lead or an architect, and I bring the habits of a decade in fintech, health and logistics.</text></g>
<g class="bub" style="animation-delay:.4s"><rect x="790" y="48" width="330" height="40" rx="14" fill="#eef1f5"/><text class="sans" x="806" y="73" font-size="14" fill="#111418">“We need this live next quarter. Can you help?”</text></g>
<g class="bub" style="animation-delay:1.4s"><rect x="898" y="100" width="262" height="40" rx="14" fill="url(#ribbon)"/><text class="sans" x="914" y="125" font-size="14" font-weight="600" fill="#ffffff">Yes. Here's how I can help 👇</text></g>
<text class="mono" x="40" y="208" font-size="11.5" fill="#9aa2ad" letter-spacing=".18em">WHAT I CAN DO FOR YOU</text>
<g class="in" style="animation-delay:0.30s">
<rect x="40.0" y="222" width="362.7" height="166" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="62.0" y="244" width="40" height="40" rx="11" fill="#eef1f5"/>
<g transform="translate(70.0 252) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
  <rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
  <line x1="6" x2="6.01" y1="6" y2="6" />
  <line x1="6" x2="6.01" y1="18" y2="18" /></g>
<text class="sans" x="116.0" y="270" font-size="18" font-weight="700" fill="#111418">Backend that scales</text>
<text class="sans" x="62.0" y="318" font-size="14" fill="#2b3038">Java/Spring or Python/FastAPI microservices,</text>
<text class="sans" x="62.0" y="339" font-size="14" fill="#2b3038">event-driven with Kafka, APIs in REST and</text>
<text class="sans" x="62.0" y="360" font-size="14" fill="#2b3038">GraphQL.</text>
</g>
<g class="in" style="animation-delay:0.37s">
<rect x="418.7" y="222" width="362.7" height="166" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="440.7" y="244" width="40" height="40" rx="11" fill="#eef1f5"/>
<g transform="translate(448.6666666666667 252) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" />
  <rect width="16" height="12" x="4" y="8" rx="2" />
  <path d="M2 14h2" />
  <path d="M20 14h2" />
  <path d="M15 13v2" />
  <path d="M9 13v2" /></g>
<text class="sans" x="494.7" y="270" font-size="18" font-weight="700" fill="#111418">AI agents &amp; RAG</text>
<text class="sans" x="440.7" y="318" font-size="14" fill="#2b3038">Agents that use your tools, RAG over your</text>
<text class="sans" x="440.7" y="339" font-size="14" fill="#2b3038">data with citations, WhatsApp automation</text>
<text class="sans" x="440.7" y="360" font-size="14" fill="#2b3038">that closes the loop.</text>
</g>
<g class="in" style="animation-delay:0.44s">
<rect x="797.3" y="222" width="362.7" height="166" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="819.3" y="244" width="40" height="40" rx="11" fill="#eef1f5"/>
<g transform="translate(827.3333333333334 252) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" />
  <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" />
  <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></g>
<text class="sans" x="873.3" y="270" font-size="18" font-weight="700" fill="#111418">Architecture &amp; leadership</text>
<text class="sans" x="819.3" y="318" font-size="14" fill="#2b3038">System design, code reviews, mentoring and</text>
<text class="sans" x="819.3" y="339" font-size="14" fill="#2b3038">hiring support. Decisions tied to business</text>
<text class="sans" x="819.3" y="360" font-size="14" fill="#2b3038">outcomes.</text>
</g>
<g class="in" style="animation-delay:0.51s">
<rect x="40.0" y="404" width="362.7" height="166" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="62.0" y="426" width="40" height="40" rx="11" fill="#eef1f5"/>
<g transform="translate(70.0 434) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
  <path d="M8 16H3v5" /></g>
<text class="sans" x="116.0" y="452" font-size="18" font-weight="700" fill="#111418">Legacy modernization</text>
<text class="sans" x="62.0" y="500" font-size="14" fill="#2b3038">Monoliths to cloud microservices and data</text>
<text class="sans" x="62.0" y="521" font-size="14" fill="#2b3038">migrations, without stopping the business.</text>
</g>
<g class="in" style="animation-delay:0.58s">
<rect x="418.7" y="404" width="362.7" height="166" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="440.7" y="426" width="40" height="40" rx="11" fill="#eef1f5"/>
<g transform="translate(448.6666666666667 434) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2" />
  <line x1="2" x2="22" y1="10" y2="10" />
  <path d="M6 14h2" /></g>
<text class="sans" x="494.7" y="452" font-size="18" font-weight="700" fill="#111418">Payments &amp; fintech</text>
<text class="sans" x="440.7" y="500" font-size="14" fill="#2b3038">Gateways, idempotent transactions,</text>
<text class="sans" x="440.7" y="521" font-size="14" fill="#2b3038">encryption at rest and reconciliation you</text>
<text class="sans" x="440.7" y="542" font-size="14" fill="#2b3038">can trust.</text>
</g>
<g class="in" style="animation-delay:0.65s">
<rect x="797.3" y="404" width="362.7" height="166" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="819.3" y="426" width="40" height="40" rx="11" fill="#eef1f5"/>
<g transform="translate(827.3333333333334 434) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
  <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09" />
  <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z" />
  <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" /></g>
<text class="sans" x="873.3" y="452" font-size="18" font-weight="700" fill="#111418">Full product builds</text>
<text class="sans" x="819.3" y="500" font-size="14" fill="#2b3038">Backend, back-office and client portals,</text>
<text class="sans" x="819.3" y="521" font-size="14" fill="#2b3038">from the first sketch to production.</text>
</g>
<text class="mono" x="40" y="610" font-size="11.5" fill="#9aa2ad" letter-spacing=".18em">HOW WE WOULD WORK</text>
<line x1="60" y1="644" x2="1140" y2="644" stroke="#e2e5ea" stroke-width="3" stroke-linecap="round"/>
<rect class="prog" x="60" y="642.5" width="1080" height="3" rx="1.5" fill="url(#ribbon)"/>
<circle class="s0" cx="60.0" cy="644" r="9" fill="#ffffff" stroke="url(#ribbon)" stroke-width="3"/>
<text class="mono" x="60.0" y="682" text-anchor="start" font-size="12" fill="#0b8fd6" letter-spacing=".1em">01</text>
<text class="sans" x="60.0" y="708" text-anchor="start" font-size="19" font-weight="800" fill="#111418">Talk</text>
<text class="sans" x="60.0" y="732" text-anchor="start" font-size="13.5" fill="#5f6774">A short call to understand the</text>
<text class="sans" x="60.0" y="751" text-anchor="start" font-size="13.5" fill="#5f6774">problem, not the tech wish list.</text>
<circle class="s1" cx="420.0" cy="644" r="9" fill="#ffffff" stroke="url(#ribbon)" stroke-width="3"/>
<text class="mono" x="420.0" y="682" text-anchor="middle" font-size="12" fill="#0b8fd6" letter-spacing=".1em">02</text>
<text class="sans" x="420.0" y="708" text-anchor="middle" font-size="19" font-weight="800" fill="#111418">Shape</text>
<text class="sans" x="420.0" y="732" text-anchor="middle" font-size="13.5" fill="#5f6774">Architecture and a plan in</text>
<text class="sans" x="420.0" y="751" text-anchor="middle" font-size="13.5" fill="#5f6774">milestones you can see and approve.</text>
<circle class="s2" cx="780.0" cy="644" r="9" fill="#ffffff" stroke="url(#ribbon)" stroke-width="3"/>
<text class="mono" x="780.0" y="682" text-anchor="middle" font-size="12" fill="#0b8fd6" letter-spacing=".1em">03</text>
<text class="sans" x="780.0" y="708" text-anchor="middle" font-size="19" font-weight="800" fill="#111418">Build</text>
<text class="sans" x="780.0" y="732" text-anchor="middle" font-size="13.5" fill="#5f6774">Small, frequent releases with</text>
<text class="sans" x="780.0" y="751" text-anchor="middle" font-size="13.5" fill="#5f6774">demos. No black boxes.</text>
<circle class="s3" cx="1140.0" cy="644" r="9" fill="#ffffff" stroke="url(#ribbon)" stroke-width="3"/>
<text class="mono" x="1140.0" y="682" text-anchor="end" font-size="12" fill="#0b8fd6" letter-spacing=".1em">04</text>
<text class="sans" x="1140.0" y="708" text-anchor="end" font-size="19" font-weight="800" fill="#111418">Run</text>
<text class="sans" x="1140.0" y="732" text-anchor="end" font-size="13.5" fill="#5f6774">Docs, handoff and support so your</text>
<text class="sans" x="1140.0" y="751" text-anchor="end" font-size="13.5" fill="#5f6774">team owns it.</text>
<text class="mono" x="40" y="814" font-size="11.5" fill="#9aa2ad" letter-spacing=".18em">WAYS TO ENGAGE</text>
<g class="in" style="animation-delay:0.60s"><rect x="40" y="830" width="208" height="38" rx="19" fill="#ffffff" stroke="#2f6bff" stroke-width="1.6"/><circle cx="60" cy="849" r="4" fill="#0b8fd6"/><text class="sans" x="72" y="854" font-size="14.5" font-weight="600" fill="#111418">Full-time remote role</text></g>
<g class="in" style="animation-delay:0.68s"><rect x="258" y="830" width="176" height="38" rx="19" fill="#ffffff" stroke="#e2e5ea" stroke-width="1"/><circle cx="278" cy="849" r="4" fill="#9aa2ad"/><text class="sans" x="290" y="854" font-size="14.5" font-weight="600" fill="#111418">Freelance project</text></g>
<g class="in" style="animation-delay:0.76s"><rect x="444" y="830" width="200" height="38" rx="19" fill="#ffffff" stroke="#e2e5ea" stroke-width="1"/><circle cx="464" cy="849" r="4" fill="#9aa2ad"/><text class="sans" x="476" y="854" font-size="14.5" font-weight="600" fill="#111418">Fractional tech lead</text></g>
<g class="in" style="animation-delay:0.84s"><rect x="654" y="830" width="192" height="38" rx="19" fill="#ffffff" stroke="#e2e5ea" stroke-width="1"/><circle cx="674" cy="849" r="4" fill="#9aa2ad"/><text class="sans" x="686" y="854" font-size="14.5" font-weight="600" fill="#111418">Architecture review</text></g>
<text class="sans" x="1160" y="854" text-anchor="end" font-size="14" fill="#5f6774">Medellín · UTC−5 · overlaps with U.S. hours</text>
</svg>