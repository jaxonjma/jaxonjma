<g class="st" style="animation-delay:1.2s"><rect x="786" y="164" width="358" height="28" rx="8" fill="none" stroke="#2a2e35" stroke-dasharray="3 3"/><text class="mono" x="798" y="182.5" font-size="11.5" fill="#7fd6ff">▸ score_drivers<tspan fill="#8b93a0">  route, capacity, rating</tspan></text><text class="mono" x="1132" y="182.5" text-anchor="end" font-size="11.5" fill="#28c840">✓</text></g>
<g class="st" style="animation-delay:2.0s"><rect x="786" y="198" width="358" height="28" rx="8" fill="none" stroke="#2a2e35" stroke-dasharray="3 3"/><text class="mono" x="798" y="216.5" font-size="11.5" fill="#7fd6ff">▸ retrieve<tspan fill="#8b93a0">  fleet policy · 3 sources</tspan></text><text class="mono" x="1132" y="216.5" text-anchor="end" font-size="11.5" fill="#28c840">✓</text></g>
<g class="st" style="animation-delay:2.8s"><rect x="786" y="232" width="358" height="28" rx="8" fill="none" stroke="#2a2e35" stroke-dasharray="3 3"/><text class="mono" x="798" y="250.5" font-size="11.5" fill="#7fd6ff">▸ whatsapp.send<tspan fill="#8b93a0">  top driver</tspan></text><text class="mono" x="1132" y="250.5" text-anchor="end" font-size="11.5" fill="#28c840">✓</text></g>
<g class="st" style="animation-delay:3.6s"><rect x="786" y="274" width="358" height="62" rx="12" fill="#262a31"/><text class="sans" x="798" y="298" font-size="13" fill="#f3f4f6">Assigned to driver #4821 (score 9.6).</text><text class="sans" x="798" y="320" font-size="13" fill="#8b93a0">Confirmed on WhatsApp · ETA 9h <tspan fill="#7fd6ff">[1][2]</tspan></text></g>
<g class="dot3" transform="translate(798 368)"><circle cx="0" cy="0" r="3" fill="#5b6370"/><circle cx="10" cy="0" r="3" fill="#5b6370"/><circle cx="20" cy="0" r="3" fill="#5b6370"/></g>
<g class="mono in d1"><text x="64" y="86" font-size="15" fill="#7fd6ff">~/jaxonjma <tspan fill="#5b6370">$</tspan> whoami<tspan class="cur">▍</tspan></text></g>
<g class="in d2"><text class="sans" x="64" y="156" font-size="62" font-weight="800" fill="#f3f4f6" letter-spacing="-1.6">Jaxon Muños</text></g>
<rect class="bar" x="64" y="176" width="150" height="4" rx="2" fill="url(#ribbon)"/>
<g class="in d3"><text class="sans" x="64" y="222" font-size="27" font-weight="600" fill="#d1d5db">Software Engineer <tspan fill="#5b6370" font-weight="300">&amp;</tspan> AI Engineer</text></g>
<g class="ph ph0"><text class="mono" x="64" y="268" font-size="17" fill="#8b93a0"><tspan fill="#7fd6ff">› </tspan>I ship AI agents that run real operations.</text></g>
<g class="ph ph1" opacity="0"><text class="mono" x="64" y="268" font-size="17" fill="#8b93a0"><tspan fill="#7fd6ff">› </tspan>I build backend systems that move money.</text></g>
<g class="ph ph2" opacity="0"><text class="mono" x="64" y="268" font-size="17" fill="#8b93a0"><tspan fill="#7fd6ff">› </tspan>I design event-driven systems at scale.</text></g>
<g class="ph ph3" opacity="0"><text class="mono" x="64" y="268" font-size="17" fill="#8b93a0"><tspan fill="#7fd6ff">› </tspan>I lead teams from design to production.</text></g>
<g class="in d5">
<rect x="64" y="312" width="85" height="30" rx="15" fill="#262a31" stroke="#2a2e35"/>
<text class="mono" x="106" y="332" text-anchor="middle" font-size="12.5" fill="#c9ced6">10+ years</text>
<rect x="156.60000000000002" y="312" width="114" height="30" rx="15" fill="#262a31" stroke="#2a2e35"/>
<text class="mono" x="214" y="332" text-anchor="middle" font-size="12.5" fill="#c9ced6">Java · Spring</text>
<rect x="278.8" y="312" width="136" height="30" rx="15" fill="#262a31" stroke="#2a2e35"/>
<text class="mono" x="347" y="332" text-anchor="middle" font-size="12.5" fill="#c9ced6">Python · FastAPI</text>
<rect x="423.20000000000005" y="312" width="99" height="30" rx="15" fill="#262a31" stroke="#2a2e35"/>
<text class="mono" x="473" y="332" text-anchor="middle" font-size="12.5" fill="#c9ced6">Kafka · AWS</text>
<rect x="530.6" y="312" width="107" height="30" rx="15" fill="#262a31" stroke="#2a2e35"/>
<text class="mono" x="584" y="332" text-anchor="middle" font-size="12.5" fill="#c9ced6">RAG · Agents</text>
</g>
<g class="in d5"><text class="mono" x="64" y="384" font-size="12.5" fill="#5b6370">fintech · healthcare · real estate · logistics · education  —  open to remote roles &amp; freelance</text></g>
</svg>