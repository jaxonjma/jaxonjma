<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Jaxon Muñoz — Senior Software Engineer, Backend &amp; AI Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161a"/>
      <stop offset="1" stop-color="#1c1f25"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#7fd6ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace; }
      .sans { font-family: 'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif; }
      .fade { animation: in .9s ease-out backwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.05s }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .edge { stroke: #c9ced6; stroke-opacity: .18; stroke-width: 1.4; fill: none; }
      .node { fill: #1c1f25; stroke: #c9ced6; stroke-opacity: .55; stroke-width: 1.4; }
      .core { fill: #1c1f25; stroke: url(#ribbon); stroke-width: 2.2; }
      .lbl { fill: #9aa3af; font-size: 11px; letter-spacing: .08em; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .bar { animation: grow 1.4s cubic-bezier(.2,.7,.2,1) .3s backwards; transform-origin: left; transform-box: fill-box; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- Left: identity -->
  <g transform="translate(64 0)">
    <text class="mono fade d1" x="0" y="78" font-size="15" fill="#7fd6ff">~/jaxonjma <tspan fill="#6b7280">$</tspan> whoami<tspan class="cursor" fill="#7fd6ff">▍</tspan></text>
    <text class="sans fade d2" x="0" y="140" font-size="52" font-weight="700" fill="#f3f4f6" letter-spacing="-1">Jaxon Muñoz</text>
    <rect class="bar" x="0" y="160" width="132" height="4" rx="2" fill="url(#ribbon)"/>
    <text class="sans fade d3" x="0" y="204" font-size="22" font-weight="500" fill="#d1d5db">Senior Software Engineer · Backend &amp; AI Systems</text>
    <text class="mono fade d4" x="0" y="244" font-size="14" fill="#9aa3af">10+ yrs  ·  Java/Spring  ·  Python/FastAPI  ·  Cloud  ·  Event-driven</text>
    <text class="mono fade d4" x="0" y="272" font-size="14" fill="#9aa3af">Founder <tspan fill="#c9ced6">@ WildCore Labs</tspan>  ·  Medellín, CO  ·  <tspan fill="#7fd6ff">open to remote</tspan></text>
  </g>

  <!-- Right: animated service mesh -->
  <g transform="translate(730 40)">
    <path id="e1" class="edge" d="M60 60 C 130 60, 140 120, 210 120"/>
    <path id="e2" class="edge" d="M60 180 C 130 180, 140 120, 210 120"/>
    <path id="e3" class="edge" d="M210 120 C 280 120, 290 50, 360 50"/>
    <path id="e4" class="edge" d="M210 120 L 360 120"/>
    <path id="e5" class="edge" d="M210 120 C 280 120, 290 190, 360 190"/>

    <circle r="3.2" fill="#7fd6ff"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3.2" fill="#2f6bff"><animateMotion dur="3.4s" begin=".7s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3.2" fill="#7fd6ff"><animateMotion dur="2.6s" begin=".3s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3.2" fill="#c9ced6"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
    <circle r="3.2" fill="#2f6bff"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>

    <g class="mono">
      <rect class="node" x="0" y="40" width="96" height="40" rx="9"/>
      <text class="lbl" x="48" y="64" text-anchor="middle">CLIENTS</text>
      <rect class="node" x="0" y="160" width="96" height="40" rx="9"/>
      <text class="lbl" x="48" y="184" text-anchor="middle">EVENTS</text>

      <rect class="core" x="160" y="96" width="104" height="48" rx="11"/>
      <circle class="pulse" cx="176" cy="120" r="3.5" fill="#7fd6ff"/>
      <text x="218" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#f3f4f6" letter-spacing=".08em">API</text>

      <rect class="node" x="330" y="30" width="96" height="40" rx="9"/>
      <text class="lbl" x="378" y="54" text-anchor="middle">LLM · RAG</text>
      <rect class="node" x="330" y="100" width="96" height="40" rx="9"/>
      <text class="lbl" x="378" y="124" text-anchor="middle">POSTGRES</text>
      <rect class="node" x="330" y="170" width="96" height="40" rx="9"/>
      <text class="lbl" x="378" y="194" text-anchor="middle">KAFKA</text>
    </g>
  </g>
</svg>
