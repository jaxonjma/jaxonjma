<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ship it! An architecture game with six real production challenges. Click to play.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#f1f3f6"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0b8fd6"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity=".045"/></pattern>
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}

.in{animation:in .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pick{animation:pick 6s ease-in-out infinite}
@keyframes pick{0%,20%{stroke:var(--l)}30%,85%{stroke:var(--g)}95%,100%{stroke:var(--l)}}
.chk{animation:chk 6s ease-in-out infinite;opacity:0}
@keyframes chk{0%,28%{opacity:0}35%,85%{opacity:1}95%,100%{opacity:0}}
.cta{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{opacity:.75}}
</style>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/><rect width="1200" height="300" rx="18" fill="url(#grid)"/>
<text class="mono" x="40" y="58" font-size="12.5" fill="#0b8fd6" letter-spacing=".22em">PLAY · 2 MINUTES</text>
<text class="sans in" x="40" y="118" font-size="54" font-weight="800" fill="#111418" letter-spacing="-2">Ship it!</text>
<text class="sans in" x="40" y="156" font-size="17" fill="#2b3038" style="animation-delay:.1s">Six real production tickets from my career.</text>
<text class="sans in" x="40" y="182" font-size="17" fill="#2b3038" style="animation-delay:.15s">Pick the stack, then see how I actually shipped it.</text>
<g class="cta"><rect x="40" y="214" width="196" height="46" rx="23" fill="url(#ribbon)"/><text class="sans" x="138" y="243" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Play now →</text></g>
