<g class="cd k1" transform="translate(0 359)"><rect x="102" y="0" width="1058" height="225" rx="16" fill="#ffffff" stroke="#e2e5ea"/><rect x="102" y="20" width="4" height="185" rx="2" fill="url(#ribbon)"/><rect x="1044" y="22" width="94" height="24" rx="12" fill="#eef1f5" stroke="#e2e5ea"/><text class="mono" x="1091" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#5f6774" letter-spacing=".1em">HEALTHCARE</text><text class="sans" x="134" y="42" font-size="20" font-weight="800" fill="#111418" letter-spacing="-.3">Unosquare<tspan font-weight="400" fill="#5f6774"> · Healthcare</tspan></text><text class="mono" x="134" y="66" font-size="12.5" fill="#0b8fd6" letter-spacing=".03em">Senior Java Developer</text><circle cx="137" cy="95" r="2.6" fill="#0b8fd6"/><text class="sans" x="150" y="100" font-size="14" fill="#2b3038">Built doctor-patient video calls over WebRTC (Twilio): virtual waiting room, real-time status, up to 50 participants, screen recording.</text><circle cx="137" cy="125" r="2.6" fill="#0b8fd6"/><text class="sans" x="150" y="130" font-size="14" fill="#2b3038">Maintained and improved microservices for reports of patients in cancer treatment.</text><rect x="134" y="173" width="46" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="157" y="190.5" text-anchor="middle" font-size="12" fill="#374151">Java</text><rect x="187" y="173" width="96" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="235" y="190.5" text-anchor="middle" font-size="12" fill="#374151">Spring Boot</text><rect x="290" y="173" width="103" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="342" y="190.5" text-anchor="middle" font-size="12" fill="#374151">Spring Batch</text><rect x="401" y="173" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="431" y="190.5" text-anchor="middle" font-size="12" fill="#374151">WebRTC</text><rect x="468" y="173" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="499" y="190.5" text-anchor="middle" font-size="12" fill="#374151">Twilio</text><rect x="536" y="173" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="570" y="190.5" text-anchor="middle" font-size="12" fill="#374151">GraphQL</text><rect x="611" y="173" width="46" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="634" y="190.5" text-anchor="middle" font-size="12" fill="#374151">SOAP</text><rect x="664" y="173" width="75" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="701" y="190.5" text-anchor="middle" font-size="12" fill="#374151">DynamoDB</text><rect x="746" y="173" width="39" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="765" y="190.5" text-anchor="middle" font-size="12" fill="#374151">AWS</text></g>
