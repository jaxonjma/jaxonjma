y="104" font-size="16" font-weight="700" fill="#111418">Technical Leader</text><circle cx="495.6666666666667" cy="127" r="2.6" fill="#0b8fd6"/><text class="sans" x="508.6666666666667" y="132" font-size="13.5" fill="#2b3038">Led onboarding, technical hiring</text><text class="sans" x="508.6666666666667" y="152" font-size="13.5" fill="#2b3038">interviews and unblocking; owned</text><text class="sans" x="508.6666666666667" y="172" font-size="13.5" fill="#2b3038">deployments, hotfixes and production</text><text class="sans" x="508.6666666666667" y="192" font-size="13.5" fill="#2b3038">incidents.</text><circle cx="495.6666666666667" cy="215" r="2.6" fill="#0b8fd6"/><text class="sans" x="508.6666666666667" y="220" font-size="13.5" fill="#2b3038">Designed and built massive report</text><text class="sans" x="508.6666666666667" y="240" font-size="13.5" fill="#2b3038">generation (fichas técnicas) for</text><text class="sans" x="508.6666666666667" y="260" font-size="13.5" fill="#2b3038">investment funds.</text><path d="M798 106 l8 7 -8 7" fill="none" stroke="#0b8fd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="815" y="66" width="319" height="254" rx="12" fill="#f7f8fa" stroke="#e2e5ea"/><text class="mono" x="833" y="86" font-size="10.5" fill="#9aa2ad" letter-spacing=".14em">STEP 3</text><text class="sans" x="833" y="104" font-size="16" font-weight="700" fill="#111418">Software Architect</text><circle cx="836.3333333333334" cy="127" r="2.6" fill="#0b8fd6"/><text class="sans" x="849.3333333333334" y="132" font-size="13.5" fill="#2b3038">Integrated investment valuation and</text><text class="sans" x="849.3333333333334" y="152" font-size="13.5" fill="#2b3038">accounting closing through MuleSoft</text><text class="sans" x="849.3333333333334" y="172" font-size="13.5" fill="#2b3038">Anypoint as iPaaS, feeding reporting</text><text class="sans" x="849.3333333333334" y="192" font-size="13.5" fill="#2b3038">and regulatory processes.</text><circle cx="836.3333333333334" cy="215" r="2.6" fill="#0b8fd6"/><text class="sans" x="849.3333333333334" y="220" font-size="13.5" fill="#2b3038">Defined caching strategies, managed</text><text class="sans" x="849.3333333333334" y="240" font-size="13.5" fill="#2b3038">GitHub baselines, led PR reviews</text><text class="sans" x="849.3333333333334" y="260" font-size="13.5" fill="#2b3038">across teams; batch processing for</text><text class="sans" x="849.3333333333334" y="280" font-size="13.5" fill="#2b3038">massive accounting files.</text><rect x="134" y="338" width="46" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="157" y="355.5" text-anchor="middle" font-size="12" fill="#374151">Java</text><rect x="187" y="338" width="96" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="235" y="355.5" text-anchor="middle" font-size="12" fill="#374151">Spring Boot</text><rect x="290" y="338" width="103" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="342" y="355.5" text-anchor="middle" font-size="12" fill="#374151">Spring Batch</text><rect x="401" y="338" width="139" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="470" y="355.5" text-anchor="middle" font-size="12" fill="#374151">MuleSoft Anypoint</text><rect x="546" y="338" width="39" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="566" y="355.5" text-anchor="middle" font-size="12" fill="#374151">AWS</text><rect x="593" y="338" width="75" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="630" y="355.5" text-anchor="middle" font-size="12" fill="#374151">DynamoDB</text><rect x="674" y="338" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="708" y="355.5" text-anchor="middle" font-size="12" fill="#374151">MongoDB</text><rect x="749" y="338" width="54" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="776" y="355.5" text-anchor="middle" font-size="12" fill="#374151">React</text><rect x="810" y="338" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="844" y="355.5" text-anchor="middle" font-size="12" fill="#374151">Jenkins</text><rect x="884" y="338" width="54" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="911" y="355.5" text-anchor="middle" font-size="12" fill="#374151">Linux</text></g>
