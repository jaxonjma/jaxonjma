<g class="cd k0" transform="translate(0 114)"><rect x="102" y="0" width="1058" height="225" rx="16" fill="#ffffff" stroke="#e2e5ea"/><rect x="102" y="20" width="4" height="185" rx="2" fill="url(#ribbon)"/><rect x="1037" y="22" width="101" height="24" rx="12" fill="#eef1f5" stroke="#e2e5ea"/><text class="mono" x="1087" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#5f6774" letter-spacing=".1em">REAL ESTATE</text><text class="sans" x="134" y="42" font-size="20" font-weight="800" fill="#111418" letter-spacing="-.3">EPAM Systems<tspan font-weight="400" fill="#5f6774"> · Real estate</tspan></text><text class="mono" x="134" y="66" font-size="12.5" fill="#0b8fd6" letter-spacing=".03em">Senior Software Engineer</text><circle cx="137" cy="95" r="2.6" fill="#0b8fd6"/><text class="sans" x="150" y="100" font-size="14" fill="#2b3038">Built reactive microservices with Kafka and Spring WebFlux to segment real-estate leads across ~1.5M U.S. properties.</text><circle cx="137" cy="125" r="2.6" fill="#0b8fd6"/><text class="sans" x="150" y="130" font-size="14" fill="#2b3038">Designed and developed a mortgage management and property history module, exposed through REST and GraphQL.</text><rect x="134" y="173" width="46" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="157" y="190.5" text-anchor="middle" font-size="12" fill="#374151">Java</text><rect x="187" y="173" width="117" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="246" y="190.5" text-anchor="middle" font-size="12" fill="#374151">Spring WebFlux</text><rect x="312" y="173" width="103" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="363" y="190.5" text-anchor="middle" font-size="12" fill="#374151">Spring Batch</text><rect x="422" y="173" width="54" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="449" y="190.5" text-anchor="middle" font-size="12" fill="#374151">Kafka</text><rect x="482" y="173" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="516" y="190.5"