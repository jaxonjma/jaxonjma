.cd{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.k0{animation-delay:0.00s}.k1{animation-delay:0.10s}.k2{animation-delay:0.20s}.k3{animation-delay:0.30s}.k4{animation-delay:0.40s}.k5{animation-delay:0.50s}</style>
