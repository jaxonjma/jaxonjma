<text class="mono" x="40" y="54" font-size="12.5" fill="#0b8fd6" letter-spacing=".22em">NOW · INDEPENDENT</text>
<text class="sans" x="40" y="90" font-size="28" font-weight="800" fill="#111418" letter-spacing="-.5">Senior Software &amp; AI Product Engineer<tspan font-weight="400" fill="#5f6774" font-size="20"> · freelance, LatAm clients</tspan></text>
<rect x="1073" y="66" width="87" height="24" rx="12" fill="url(#ribbon)" stroke="#e2e5ea"/>
<text class="mono" x="1117" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing=".1em">AVAILABLE</text>
</g>
<g class="cd k1"><rect x="40" y="132" width="551" height="393" rx="16" fill="#ffffff" stroke="#e2e5ea"/><rect x="40" y="152" width="4" height="353" rx="2" fill="url(#ribbon)"/><rect x="482" y="154" width="87" height="24" rx="12" fill="#eef1f5" stroke="#e2e5ea"/><text class="mono" x="526" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#5f6774" letter-spacing=".1em">LOGISTICS</text><text class="sans" x="72" y="174" font-size="19" font-weight="800" fill="#111418" letter-spacing="-.3">Freight logistics<tspan font-weight="400" fill="#5f6774"> · Colombia</tspan></text><text class="mono" x="72" y="198" font-size="12.5" fill="#0b8fd6" letter-spacing=".03em">AI dispatch · real-time tracking · migration</text><circle cx="75" cy="227" r="2.6" fill="#0b8fd6"/><text class="sans" x="88" y="232" font-size="14" fill="#2b3038">Built an AI agent that automates freight service assignment,</text><text class="sans" x="88" y="253" font-size="14" fill="#2b3038">replacing manual dispatch: drivers are picked by performance</text><text class="sans" x="88" y="274" font-size="14" fill="#2b3038">score and contacted over WhatsApp, removing dispatcher bias.</text><circle cx="75" cy="299" r="2.6" fill="#0b8fd6"/><text class="sans" x="88" y="304" font-size="14" fill="#2b3038">Real-time transport monitoring across Colombia: GPS tracking,</text><text class="sans" x="88" y="325" font-size="14" fill="#2b3038">trip status via push and WhatsApp, digital freight completion.</text><circle cx="75" cy="350" r="2.6" fill="#0b8fd6"/><text class="sans" x="88" y="355" font-size="14" fill="#2b3038">Led the functional and technical design and the migration from</text><text class="sans" x="88" y="376" font-size="14" fill="#2b3038">PHP/Laravel and Angular monoliths to AWS microservices.</text><rect x="72" y="419" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="102" y="436.5" text-anchor="middle" font-size="12" fill="#374151">Python</text><rect x="140" y="419" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="173" y="436.5" text-anchor="middle" font-size="12" fill="#374151">FastAPI</text><rect x="214" y="419" width="89" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="259" y="436.5" text-anchor="middle" font-size="12" fill="#374151">PostgreSQL</text><rect x="310" y="419" width="39" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="330" y="436.5" text-anchor="middle" font-size="12" fill="#374151">AWS</text><rect x="357" y="419" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="387" y="436.5" text-anchor="middle" font-size="12" fill="#374151">Docker</text><rect x="424" y="419" width="103" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="476" y="436.5" text-anchor="middle" font-size="12" fill="#374151">WhatsApp API</text></g>
<g class="cd k2"><rect x="609" y="132" width="551" height="393" rx="16" fill="#ffffff" stroke="#e2e5ea"/><rect x="609" y="152" width="4" height="353" rx="2" fill="url(#ribbon)"/><rect x="1074" y="154" width="64" height="24" rx="12" fill="#eef1f5" stroke="#e2e5ea"/><text class="mono" x="1106" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#5f6774" letter-spacing=".1em">HEALTH</text><text class="sans" x="641" y="174" font-size="19" font-weight="800" fill="#111418" letter-spacing="-.3">Medical wellness<tspan font-weight="400" fill="#5f6774"> · B2B &amp; B2C</tspan></text><text class="mono" x="641" y="198" font-size="12.5" fill="#0b8fd6" letter-spacing=".03em">Full stack on a multi-tenant RAG engine</text><circle cx="644" cy="227" r="2.6" fill="#0b8fd6"/><text class="sans" x="657" y="232" font-size="14" fill="#2b3038">Backend, back-office and client portal on a multi-tenant RAG</text><text class="sans" x="657" y="253" font-size="14" fill="#2b3038">engine: tenant isolation by API key, answers grounded in</text><text class="sans" x="657" y="274" font-size="14" fill="#2b3038">citations above a relevance threshold.</text><circle cx="644" cy="299" r="2.6" fill="#0b8fd6"/><text class="sans" x="657" y="304" font-size="14" fill="#2b3038">Multi-turn AI sales agent driven by a state machine, replicating</text><text class="sans" x="657" y="325" font-size="14" fill="#2b3038">the human closer's WhatsApp flow with a playbook mined from voice</text><text class="sans" x="657" y="346" font-size="14" fill="#2b3038">notes (Whisper).</text><circle cx="644" cy="371" r="2.6" fill="#0b8fd6"/><text class="sans" x="657" y="376" font-size="14" fill="#2b3038">6 document templates automated at sale close: AI pre-fills, a</text><text class="sans" x="657" y="397" font-size="14" fill="#2b3038">licensed professional signs. Human in the loop by design.</text><rect x="641" y="440" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="675" y="457.5" text-anchor="middle" font-size="12" fill="#374151">FastAPI</text><rect x="716" y="440" width="75" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="753" y="457.5" text-anchor="middle" font-size="12" fill="#374151">Supabase</text><rect x="798" y="440" width="75" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="835" y="457.5" text-anchor="middle" font-size="12" fill="#374151">pgvector</text><rect x="879" y="440" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="910" y="457.5" text-anchor="middle" font-size="12" fill="#374151">Claude</text><rect x="947" y="440" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="977" y="457.5" text-anchor="middle" font-size="12" fill="#374151">Cohere</text><rect x="1014" y="440" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="1048" y="457.5" text-anchor="middle" font-size="12" fill="#374151">Whisper</text><rect x="641" y="473" width="54" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="668" y="490.5" text-anchor="middle" font-size="12" fill="#374151">Redis</text><rect x="702" y="473" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="735" y="490.5" text-anchor="middle" font-size="12" fill="#374151">Next.js</text></g>
<g class="cd k3"><rect x="40" y="543" width="551" height="351" rx="16" fill="#ffffff" stroke="#e2e5ea"/><rect x="40" y="563" width="4" height="311" rx="2" fill="url(#ribbon)"/><rect x="482" y="565" width="87" height="24" rx="12" fill="#eef1f5" stroke="#e2e5ea"/><text class="mono" x="526" y="581" text-anchor="middle" font-size="11" font-weight="700" fill="#5f6774" letter-spacing=".1em">EDUCATION</text><text class="sans" x="72" y="585" font-size="19" font-weight="800" fill="#111418" letter-spacing="-.3">Multi-brand ecosystem<tspan font-weight="400" fill="#5f6774"> · 4 products</tspan></text><text class="mono" x="72" y="609" font-size="12.5" fill="#0b8fd6" letter-spacing=".03em">Backend architecture · shared AI layer</text><circle cx="75" cy="638" r="2.6" fill="#0b8fd6"/><text class="sans" x="88" y="643" font-size="14" fill="#2b3038">Architected and built the backend behind 4 products:</text><text class="sans" x="88" y="664" font-size="14" fill="#2b3038">subscriptions, trading education, travel and investments.</text><circle cx="75" cy="689" r="2.6" fill="#0b8fd6"/><text class="sans" x="88" y="694" font-size="14" fill="#2b3038">Migrated legacy projects into one platform with member panel,</text><text class="sans" x="88" y="715" font-size="14" fill="#2b3038">back-office and landing pages.</text><circle cx="75" cy="740" r="2.6" fill="#0b8fd6"/><text class="sans" x="88" y="745" font-size="14" fill="#2b3038">Shared AI layer across brands: RAG knowledge engine, CRM engine</text><text class="sans" x="88" y="766" font-size="14" fill="#2b3038">and AI coaching agents.</text><rect x="72" y="809" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="106" y="826.5" text-anchor="middle" font-size="12" fill="#374151">FastAPI</text><rect x="147" y="809" width="75" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="184" y="826.5" text-anchor="middle" font-size="12" fill="#374151">Supabase</text><rect x="228" y="809" width="75" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="266" y="826.5" text-anchor="middle" font-size="12" fill="#374151">pgvector</text><rect x="310" y="809" width="68" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="344" y="826.5" text-anchor="middle" font-size="12" fill="#374151">Next.js</text><rect x="385" y="809" width="117" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="444" y="826.5" text-anchor="middle" font-size="12" fill="#374151">TanStack Query</text><rect x="72" y="842" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="102" y="859.5" text-anchor="middle" font-size="12" fill="#374151">Claude</text><rect x="140" y="842" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="170" y="859.5" text-anchor="middle" font-size="12" fill="#374151">Vercel</text></g>
<g class="cd k4"><rect x="609" y="543" width="551" height="351" rx="16" fill="#ffffff" stroke="#e2e5ea"/><rect x="609" y="563" width="4" height="311" rx="2" fill="url(#ribbon)"/><rect x="1066" y="565" width="72" height="24" rx="12" fill="#eef1f5" stroke="#e2e5ea"/><text class="mono" x="1102" y="581" text-anchor="middle" font-size="11" font-weight="700" fill="#5f6774" letter-spacing=".1em">FINTECH</text><text class="sans" x="641" y="585" font-size="19" font-weight="800" fill="#111418" letter-spacing="-.3">Fintech<tspan font-weight="400" fill="#5f6774"> · Consulting</tspan></text><text class="mono" x="641" y="609" font-size="12.5" fill="#0b8fd6" letter-spacing=".03em">Java &amp; Spring backend · payments</text><circle cx="644" cy="638" r="2.6" fill="#0b8fd6"/><text class="sans" x="657" y="643" font-size="14" fill="#2b3038">Designed and developed new backend features in Java and Spring.</text><circle cx="644" cy="668" r="2.6" fill="#0b8fd6"/><text class="sans" x="657" y="673" font-size="14" fill="#2b3038">Integrated payment gateways (Stripe, Whop) with idempotent</text><text class="sans" x="657" y="694" font-size="14" fill="#2b3038">transactions and encryption of sensitive data at rest.</text><rect x="641" y="737" width="46" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="664" y="754.5" text-anchor="middle" font-size="12" fill="#374151">Java</text><rect x="694" y="737" width="96" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="742" y="754.5" text-anchor="middle" font-size="12" fill="#374151">Spring Boot</text><rect x="798" y="737" width="124" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="860" y="754.5" text-anchor="middle" font-size="12" fill="#374151">Spring Security</text><rect x="929" y="737" width="39" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="949" y="754.5" text-anchor="middle" font-size="12" fill="#374151">JPA</text><rect x="975" y="737" width="61" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="1006" y="754.5" text-anchor="middle" font-size="12" fill="#374151">Stripe</text><rect x="1043" y="737" width="46" height="26" rx="7" fill="#eef1f5"/><text class="mono" x="1066" y="754.5" text-anchor="middle" font-size="12" fill="#374151">Whop</text></g>
