<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Tech constellation: languages, data and streaming, cloud and DevOps, AI engineering">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#f1f3f6"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0b8fd6"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity=".045"/></pattern>
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}

.ring{animation:dash 30s linear infinite}
@keyframes dash{to{stroke-dashoffset:-600}}
.pl{animation:pop .7s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.core{animation:breathe 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
</defs>
<radialGradient id="cg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2f6bff" stop-opacity=".35"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
