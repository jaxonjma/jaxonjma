<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Impact: 10+ years; ~1.5M properties in a Kafka pipeline; 50-participant telemedicine; 4 industries">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15171b"/><stop offset="1" stop-color="#0f1013"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#7fd6ff"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}

.c{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.u{animation:grow 1.1s cubic-bezier(.2,.7,.2,1) backwards;transform-origin:left;transform-box:fill-box}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.c0{animation-delay:0.00s}.u0{animation-delay:0.30s}.c1{animation-delay:0.12s}.u1{animation-delay:0.42s}.c2{animation-delay:0.24s}.u2{animation-delay:0.54s}.c3{animation-delay:0.36s}.u3{animation-delay:0.66s}</style>
</defs>
<linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f4f6"/><stop offset="1" stop-color="#7fd6ff"/></linearGradient>
<rect width="1200" height="200" rx="18" fill="url(#bg)"/>
<g class="c c0">
<rect x="40.0" y="28" width="268.0" height="144" rx="14" fill="#1b1e23" stroke="#2a2e35"/>
<text class="sans" x="62.0" y="86" font-size="40" font-weight="800" fill="url(#num)" letter-spacing="-1">10+<tspan class="mono" font-size="14" font-weight="500" fill="#8b93a0" letter-spacing="0" dx="8">years</tspan></text>
<text class="sans" x="62.0" y="122" font-size="14" fill="#d1d5db">shipping production software</text>
<text class="mono" x="62.0" y="150" font-size="11.5" fill="#5b6370" letter-spacing=".06em">JAVA · PYTHON · CLOUD</text>
</g>
<rect class="u u0" x="62.0" y="96" width="36" height="3" rx="1.5" fill="url(#ribbon)"/>
<g class="c c1">
<rect x="324.0" y="28" width="268.0" height="144" rx="14" fill="#1b1e23" stroke="#2a2e35"/>
<text class="sans" x="346.0" y="86" font-size="40" font-weight="800" fill="url(#num)" letter-spacing="-1">~1.5M<tspan class="mono" font-size="14" font-weight="500" fill="#8b93a0" letter-spacing="0" dx="8">properties</tspan></text>
<text class="sans" x="346.0" y="122" font-size="14" fill="#d1d5db">segmented via reactive Kafka</text>
<text class="mono" x="346.0" y="150" font-size="11.5" fill="#5b6370" letter-spacing=".06em">EPAM · CORELOGIC</text>
</g>
<rect class="u u1" x="346.0" y="96" width="36" height="3" rx="1.5" fill="url(#ribbon)"/>
<g class="c c2">
<rect x="608.0" y="28" width="268.0" height="144" rx="14" fill="#1b1e23" stroke="#2a2e35"/>
<text class="sans" x="630.0" y="86" font-size="40" font-weight="800" fill="url(#num)" letter-spacing="-1">50<tspan class="mono" font-size="14" font-weight="500" fill="#8b93a0" letter-spacing="0" dx="8">participants</tspan></text>
<text class="sans" x="630.0" y="122" font-size="14" fill="#d1d5db">per WebRTC telemedicine call</text>
<text class="mono" x="630.0" y="150" font-size="11.5" fill="#5b6370" letter-spacing=".06em">UNOSQUARE · TWILIO</text>
</g>
<rect class="u u2" x="630.0" y="96" width="36" height="3" rx="1.5" fill="url(#ribbon)"/>
<g class="c c3">
<rect x="892.0" y="28" width="268.0" height="144" rx="14" fill="#1b1e23" stroke="#2a2e35"/>
<text class="sans" x="914.0" y="86" font-size="40" font-weight="800" fill="url(#num)" letter-spacing="-1">4<tspan class="mono" font-size="14" font-weight="500" fill="#8b93a0" letter-spacing="0" dx="8">industries</tspan></text>
<text class="sans" x="914.0" y="122" font-size="14" fill="#d1d5db">fintech · health · real estate · ads</text>
<text class="mono" x="914.0" y="150" font-size="11.5" fill="#5b6370" letter-spacing=".06em">REGULATED &amp; HIGH-STAKES</text>
</g>
<rect class="u u3" x="914.0" y="96" width="36" height="3" rx="1.5" fill="url(#ribbon)"/>
</svg>