<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="634" viewBox="0 0 1200 634" role="img" aria-label="How I work: technical leadership, review and baselines, correctness where money moves, legacy to modern, AI with guardrails, agile and tested">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#f1f3f6"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0b8fd6"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity=".045"/></pattern>
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.cd{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}</style>
</defs>
<rect width="1200" height="634" rx="18" fill="url(#bg)"/><rect width="1200" height="634" rx="18" fill="url(#grid)"/>
<text class="mono" x="40" y="54" font-size="12.5" fill="#0b8fd6" letter-spacing=".22em">HOW I WORK</text>
<text class="sans" x="40" y="90" font-size="28" font-weight="800" fill="#111418" letter-spacing="-.5">Architecture decisions, tied to business outcomes</text>
<text class="sans" x="40" y="122" font-size="15.5" fill="#5f6774">What teams get when I join: habits from a decade of fintech, healthcare and real-estate systems.</text>
<g class="cd" style="animation-delay:0.00s">
<rect x="40.0" y="160" width="361.3" height="208" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="66.0" y="186" width="44" height="44" rx="12" fill="#eef1f5" stroke="#e2e5ea"/>
<g transform="translate(76.0 196) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
  <path d="M16 3.128a4 4 0 0 1 0 7.744" />
  <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
  <circle cx="9" cy="7" r="4" /></g>
<text class="mono" x="375.3" y="204" text-anchor="end" font-size="12" fill="#9aa2ad">01</text>
<text class="sans" x="66.0" y="260" font-size="18" font-weight="700" fill="#111418">Technical leadership</text>
<text class="sans" x="66.0" y="288" font-size="14" fill="#2b3038">Onboarding, technical hiring interviews</text>
<text class="sans" x="66.0" y="309" font-size="14" fill="#2b3038">and unblocking people. I own deployments,</text>
<text class="sans" x="66.0" y="330" font-size="14" fill="#2b3038">hotfixes and production incidents with the</text>
<text class="sans" x="66.0" y="351" font-size="14" fill="#2b3038">team.</text>
</g>
<g class="cd" style="animation-delay:0.08s">
<rect x="419.3" y="160" width="361.3" height="208" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="445.3" y="186" width="44" height="44" rx="12" fill="#eef1f5" stroke="#e2e5ea"/>
<g transform="translate(455.3333333333333 196) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3" />
  <circle cx="6" cy="6" r="3" />
  <path d="M13 6h3a2 2 0 0 1 2 2v7" />
  <line x1="6" x2="6" y1="9" y2="21" /></g>
<text class="mono" x="754.7" y="204" text-anchor="end" font-size="12" fill="#9aa2ad">02</text>
<text class="sans" x="445.3" y="260" font-size="18" font-weight="700" fill="#111418">Review and baselines</text>
<text class="sans" x="445.3" y="288" font-size="14" fill="#2b3038">Led PR reviews across teams, managed</text>
<text class="sans" x="445.3" y="309" font-size="14" fill="#2b3038">GitHub baselines and defined caching</text>
<text class="sans" x="445.3" y="330" font-size="14" fill="#2b3038">strategies, so quality does not depend on</text>
<text class="sans" x="445.3" y="351" font-size="14" fill="#2b3038">heroics.</text>
</g>
<g class="cd" style="animation-delay:0.16s">
<rect x="798.7" y="160" width="361.3" height="208" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="824.7" y="186" width="44" height="44" rx="12" fill="#eef1f5" stroke="#e2e5ea"/>
<g transform="translate(834.6666666666666 196) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></g>
<text class="mono" x="1134.0" y="204" text-anchor="end" font-size="12" fill="#9aa2ad">03</text>
<text class="sans" x="824.7" y="260" font-size="18" font-weight="700" fill="#111418">Correctness where money moves</text>
<text class="sans" x="824.7" y="288" font-size="14" fill="#2b3038">Idempotent transactions, encryption of</text>
<text class="sans" x="824.7" y="309" font-size="14" fill="#2b3038">sensitive data at rest, nightly support</text>
<text class="sans" x="824.7" y="330" font-size="14" fill="#2b3038">for valuation and accounting closings.</text>
</g>
<g class="cd" style="animation-delay:0.24s">
<rect x="40.0" y="386" width="361.3" height="208" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="66.0" y="412" width="44" height="44" rx="12" fill="#eef1f5" stroke="#e2e5ea"/>
<g transform="translate(76.0 422) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
  <path d="M21 3v5h-5" />
  <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
  <path d="M8 16H3v5" /></g>
<text class="mono" x="375.3" y="430" text-anchor="end" font-size="12" fill="#9aa2ad">04</text>
<text class="sans" x="66.0" y="486" font-size="18" font-weight="700" fill="#111418">Legacy to modern</text>
<text class="sans" x="66.0" y="514" font-size="14" fill="#2b3038">Migration strategies from PHP/Laravel and</text>
<text class="sans" x="66.0" y="535" font-size="14" fill="#2b3038">Angular monoliths to AWS microservices,</text>
<text class="sans" x="66.0" y="556" font-size="14" fill="#2b3038">and legacy projects unified into one</text>
<text class="sans" x="66.0" y="577" font-size="14" fill="#2b3038">platform.</text>
</g>
<g class="cd" style="animation-delay:0.32s">
<rect x="419.3" y="386" width="361.3" height="208" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="445.3" y="412" width="44" height="44" rx="12" fill="#eef1f5" stroke="#e2e5ea"/>
<g transform="translate(455.3333333333333 422) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8" />
  <rect width="16" height="12" x="4" y="8" rx="2" />
  <path d="M2 14h2" />
  <path d="M20 14h2" />
  <path d="M15 13v2" />
  <path d="M9 13v2" /></g>
<text class="mono" x="754.7" y="430" text-anchor="end" font-size="12" fill="#9aa2ad">05</text>
<text class="sans" x="445.3" y="486" font-size="18" font-weight="700" fill="#111418">AI with guardrails</text>
<text class="sans" x="445.3" y="514" font-size="14" fill="#2b3038">Citation grounding, relevance thresholds,</text>
<text class="sans" x="445.3" y="535" font-size="14" fill="#2b3038">state machines and a human in the loop</text>
<text class="sans" x="445.3" y="556" font-size="14" fill="#2b3038">wherever an error would be costly.</text>
</g>
<g class="cd" style="animation-delay:0.40s">
<rect x="798.7" y="386" width="361.3" height="208" rx="16" fill="#ffffff" stroke="#e2e5ea"/>
<rect x="824.7" y="412" width="44" height="44" rx="12" fill="#eef1f5" stroke="#e2e5ea"/>
<g transform="translate(834.6666666666666 422) scale(1.0000)" fill="none" stroke="#0b8fd6" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7 6.82 21.18a2.83 2.83 0 0 1-3.99-.01a2.83 2.83 0 0 1 0-4L17 3" />
  <path d="m16 2 6 6" />
  <path d="M12 16H4" /></g>
<text class="mono" x="1134.0" y="430" text-anchor="end" font-size="12" fill="#9aa2ad">06</text>
<text class="sans" x="824.7" y="486" font-size="18" font-weight="700" fill="#111418">Agile, tested, automated</text>
<text class="sans" x="824.7" y="514" font-size="14" fill="#2b3038">Scrum teams, unit and integration testing</text>
<text class="sans" x="824.7" y="535" font-size="14" fill="#2b3038">(JUnit), CI/CD with Jenkins and GitHub.</text>
<text class="sans" x="824.7" y="556" font-size="14" fill="#2b3038">Boring to operate is the goal.</text>
</g>
</svg>