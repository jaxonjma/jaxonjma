<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Jaxon Muños — Software Engineer &amp; AI Engineer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfc"/><stop offset="1" stop-color="#f1f3f6"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0b8fd6"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f172a" stroke-opacity=".045"/></pattern>
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}

.in{animation:in .9s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}.d5{animation-delay:1.1s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{animation:grow 1.3s cubic-bezier(.2,.7,.2,1) .35s backwards;transform-origin:left;transform-box:fill-box}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ph{animation:rot 12.8s ease-in-out infinite backwards}
@keyframes rot{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
.nd{animation:nd 3s ease-in-out infinite}@keyframes nd{0%,100%{opacity:.45}50%{opacity:1}}
.ph0{animation-delay:0.0s}.ph1{animation-delay:3.2s}.ph2{animation-delay:6.4s}.ph3{animation-delay:9.600000000000001s}</style>
</defs>
<radialGradient id="glow" cx=".78" cy=".5" r=".5"><stop offset="0" stop-color="#2f6bff" stop-opacity=".10"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
<rect width="1200" height="440" rx="18" fill="url(#bg)"/><rect width="1200" height="440" rx="18" fill="url(#grid)"/>
<rect width="1200" height="440" rx="18" fill="url(#glow)"/>
<style>
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.handL{animation:tapL .32s ease-in-out infinite alternate}
.handR{animation:tapR .32s ease-in-out .16s infinite alternate}
@keyframes tapL{to{transform:translateY(-4px)}}@keyframes tapR{to{transform:translateY(-4px)}}
.fl{animation:fl 4.5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-9px)}}
.steam{animation:steam 2.6s ease-in-out infinite;opacity:0}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
.pop{animation:pop 8s ease-out infinite backwards}
@keyframes pop{0%{opacity:0;transform:scale(.85)}5%,85%{opacity:1;transform:none}95%,100%{opacity:0}}
.head{animation:nod 6s ease-in-out infinite;transform-origin:930px 200px}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
.type{animation:type 7s steps(30) infinite backwards}
@keyframes type{0%{clip-path:inset(0 100% 0 0)}35%,100%{clip-path:inset(0 0 0 0)}}
</style>
