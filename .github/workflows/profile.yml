name: Profile cards

on:
  schedule:
    - cron: "23 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main, profile-v2]
    paths-ignore: ["generated/**", "profile-3d-contrib/**"]

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Languages and stats cards
        run: python3 .github/scripts/github_cards.py "${{ github.repository_owner }}" generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A generated profile-3d-contrib
          if git commit -m "chore: refresh profile cards"; then
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2f6bff&color_dots=#e8ebf0,#c6dbff,#8db6ff,#4b8bff,#2459e0
            dist/snake-dark.svg?palette=github-dark&color_snake=#7fd6ff&color_dots=#262a31,#123a75,#1f5bc4,#3d86ff,#7fd6ff

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
